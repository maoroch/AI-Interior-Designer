services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["minio_data:/data"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    depends_on: [mongo, redis, minio]
    volumes: ["./backend:/app"]

  worker:
    build: ./backend
    command: ["taskiq", "worker", "app.tasks.broker:broker", "app.tasks.pipeline_tasks"]
    env_file: ./backend/.env
    depends_on: [mongo, redis, minio]
    volumes: ["./backend:/app"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on: [backend]
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]

volumes:
  mongo_data:
  minio_data:
